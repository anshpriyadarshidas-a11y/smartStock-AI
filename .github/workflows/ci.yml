name: SmartStock AI CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci

      - name: Run Backend Unit Tests
        run: npm test

      - name: Run Backend Linter
        run: npm run lint

  test-ml:
    name: ML Service Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install pytest

      - name: Run ML Pytest Suite
        run: pytest ml -v

  e2e-workflow:
    name: End-to-End Workflow Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci
          pip install -r ml/requirements.txt pytest

      - name: Start Backend Server
        run: |
          nohup npm run start --workspace backend > /tmp/smartstock-backend.log 2>&1 &
          for i in {1..20}; do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4000/health

      - name: Run End-to-End Workflow Test
        run: node backend/e2e.verify.js

  test-e2e-playwright:
    name: Playwright End-to-End UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
